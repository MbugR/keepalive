name: keepalive

on:
  schedule:
    # Backup only. The self-dispatch chain is the real wake.
    - cron: "3/5 * * * *"
  workflow_dispatch:

# Repository secrets only. The default token stays unused.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Send GET
        env:
          WAKE_URL: ${{ secrets.WAKE_URL }}
        run: |
          if [ -z "${WAKE_URL}" ]; then
            echo "WAKE_URL is not set"
            exit 1
          fi
          err="$(mktemp)"
          set +e
          code="$(curl -4 --silent --output /dev/null --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 90 --write-out '%{http_code}' --stderr "${err}" "${WAKE_URL}")"
          ec=$?
          set -e
          python3 - "${err}" << 'PY'
          import os, sys
          secret = os.environ.get("WAKE_URL", "")
          text = open(sys.argv[1], errors="replace").read()
          if secret:
              text = text.replace(secret, "[url]")
          host = secret.split("://", 1)[-1].split("/")[0]
          if host:
              text = text.replace(host, "[host]")
          print(text, end="")
          PY
          rm -f "${err}"
          echo "curl_exit=${ec}"
          echo "http_code=${code:-000}"
          if [ -z "${code}" ] || [ "${code}" = "000" ]; then
            exit 1
          fi

      - name: Queue next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "DISPATCH_TOKEN is not set"
            exit 1
          fi
          # Keep the chain alive even when GET fails or a cron run overlaps.
          sleep 200
          queued="$(gh run list --repo "${{ github.repository }}" --workflow keepalive.yml --limit 30 --json databaseId,status | THIS_RUN="${THIS_RUN}" python3 -c 'import json,os,sys; runs=json.load(sys.stdin); self=int(os.environ["THIS_RUN"]); print(sum(1 for r in runs if r["databaseId"]!=self and r["status"] in ("queued","waiting","pending","requested")))')"
          echo "queued_others=${queued}"
          if [ "${queued}" -gt 0 ]; then
            echo "A follow-up is already queued"
            exit 0
          fi
          gh workflow run keepalive.yml --repo "${{ github.repository }}" --ref main
          echo "queued next run"
