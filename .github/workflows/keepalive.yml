name: keepalive

on:
  schedule:
    # Weak backup only. GitHub starts it a few times a day (37 times in the week to 2026-10-05), so a
    # stopped chain can stay down for hours; start it by hand instead of waiting for this.
    - cron: "3/5 * * * *"
  workflow_dispatch:

# One run at a time. A new run waits as "pending" until the running one ends; a newer pending run replaces an older one.
concurrency:
  group: keepalive
  cancel-in-progress: false

# The built-in token may start the next run: workflow_dispatch is the one event it is allowed to trigger.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    # Worst case with every retry spent is about 16 minutes (gh timeouts, curl retries, the wait).
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # First, so the chain survives if this run dies later. On 2026-10-05 the wait got SIGTERM (exit
      # code 143) before the next run was queued, and the chain stopped. The queued run stays pending
      # until this one ends, so it does not start early. Always on main: a run started by hand from
      # another branch hands the chain back to main, and deleting that branch cannot stop it.
      # timeout: gh has no request timeout of its own, and a hung call would hold up the GET.
      - name: Queue next run
        run: |
          for attempt in 1 2 3; do
            if timeout 30 gh workflow run keepalive.yml --repo "${GITHUB_REPOSITORY}" --ref main; then
              echo "queued next run"
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed"
            sleep 5
          done
          echo "::warning::Could not queue the next run; the last step tries again"

      - name: Send GET
        if: ${{ !cancelled() }}
        env:
          WAKE_URL: ${{ secrets.WAKE_URL }}
        run: |
          if [ -z "${WAKE_URL}" ]; then
            echo "WAKE_URL is not set"
            exit 1
          fi
          err="$(mktemp)"
          set +e
          code="$(curl -4 --silent --output /dev/null --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 90 --write-out '%{http_code}' --stderr "${err}" "${WAKE_URL}")"
          ec=$?
          set -e
          python3 - "${err}" << 'PY'
          import os, sys
          secret = os.environ.get("WAKE_URL", "")
          text = open(sys.argv[1], errors="replace").read()
          if secret:
              text = text.replace(secret, "[url]")
          host = secret.split("://", 1)[-1].split("/")[0]
          if host:
              text = text.replace(host, "[host]")
          print(text, end="")
          PY
          rm -f "${err}"
          echo "curl_exit=${ec}"
          echo "http_code=${code:-000}"
          if [ -z "${code}" ] || [ "${code}" = "000" ]; then
            exit 1
          fi

      # Spaces the runs: the queued run starts as soon as this one ends. Runs after a failed GET too,
      # so failures do not turn into a tight loop.
      - name: Wait
        if: ${{ !cancelled() }}
        run: sleep 200

      # Second chance if the first step could not queue the next run (a GitHub API error, say).
      - name: Make sure the next run is queued
        if: ${{ !cancelled() }}
        env:
          THIS_RUN: ${{ github.run_id }}
        run: |
          # A failed check counts as "nothing queued": an extra dispatch only replaces the pending run.
          queued="$(timeout 30 gh run list --repo "${GITHUB_REPOSITORY}" --workflow keepalive.yml --limit 30 --json databaseId,status | python3 -c 'import json,os,sys; runs=json.load(sys.stdin); me=int(os.environ["THIS_RUN"]); print(sum(1 for r in runs if r["databaseId"]!=me and r["status"] in ("queued","waiting","pending","requested")))')" || queued=0
          echo "queued_others=${queued}"
          if [ "${queued}" -gt 0 ]; then
            echo "The next run is queued"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if timeout 30 gh workflow run keepalive.yml --repo "${GITHUB_REPOSITORY}" --ref main; then
              echo "queued next run"
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed"
            sleep 15
          done
          exit 1
