name: activity

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record weekly activity
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.txt
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Record weekly activity"
          git push
